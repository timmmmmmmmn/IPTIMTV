name: APK bouwen

# Bij elke push naar main: een ondertekende APK bouwen en als release publiceren.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # De Android SDK staat al op de GitHub-server; alleen versie 37 bijzetten.
      - name: Android SDK 37 installeren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Ondertekeningssleutel klaarzetten
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iptimtv-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.IPTIMTV_KEYSTORE_BASE64 }}

      - name: APK bouwen
        run: ./gradlew assembleRelease --no-configuration-cache --console=plain
        env:
          IPTIMTV_KEYSTORE: ${{ runner.temp }}/iptimtv-release.jks
          IPTIMTV_KEYSTORE_PASSWORD: ${{ secrets.IPTIMTV_KEYSTORE_PASSWORD }}
          IPTIMTV_KEY_ALIAS: ${{ secrets.IPTIMTV_KEY_ALIAS }}
          IPTIMTV_KEY_PASSWORD: ${{ secrets.IPTIMTV_KEY_PASSWORD }}

      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk IPTIMTV.apk
          printf '%s\n' "${COMMIT_MSG:-Handmatig gebouwd}" > notes.md
          gh release create "v1.0.${{ github.run_number }}" IPTIMTV.apk \
            --title "IPTIMTV 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
