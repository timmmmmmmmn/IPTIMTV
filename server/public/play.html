<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>IPTIMTV</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
</head>
<body style="background:#000">
<!-- Afspeelpagina via http: speelt de stream rechtstreeks bij je provider af (voor providers die de IPTIMTV-server blokkeren). -->
<div class="player">
  <div class="bar-top">
    <button class="icon-btn" id="close" aria-label="Terug"><svg class="i" viewBox="0 0 24 24"><path d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/></svg></button>
    <div class="txt"><b></b><span></span></div>
    <button class="icon-btn hidden" id="prev" aria-label="Vorig kanaal"><svg class="i" viewBox="0 0 24 24"><path d="M6,6h2v12H6zM9.5,12l8.5,6V6z"/></svg></button>
    <button class="icon-btn hidden" id="next" aria-label="Volgend kanaal"><svg class="i" viewBox="0 0 24 24"><path d="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/></svg></button>
  </div>
  <video playsinline controls autoplay></video>
  <div class="msg hidden"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const API = 'https://iptv.timvanbergen.nl/api/';

// Gegevens komen in het #-deel mee (gaat nooit naar een server); bewaren voor herladen en daarna uit de adresbalk halen.
let data;
try {
  const raw = location.hash.slice(1);
  if (raw) {
    const bin = atob(raw);
    data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    sessionStorage.setItem('play', JSON.stringify(data));
    history.replaceState(null, '', location.pathname);
  } else data = JSON.parse(sessionStorage.getItem('play'));
} catch { data = null; }

const el = $('.player'), video = $('video');
const back = () => { location.href = data?.back || 'https://iptv.timvanbergen.nl/'; };
$('#close').onclick = back;

if (!data?.items?.length) {
  $('.msg').textContent = 'Niets om af te spelen.';
  $('.msg').classList.remove('hidden');
} else {
  const { items, live, token } = data;
  let i = data.i || 0, startAt = data.startAt || 0, hls = null, watched = 0, lastTick = Date.now(), idle;

  const wake = () => { el.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => el.classList.add('idle'), 3500); };
  el.addEventListener('pointermove', wake); el.addEventListener('touchstart', wake, { passive: true }); wake();

  // Kijktijd en waar je gebleven bent, net als in de app.
  const flush = (finished = false) => {
    const it = items[i];
    if (!it?.key || !token) return;
    const dur = isFinite(video.duration) ? Math.round(video.duration * 1000) : 0;
    const body = { key: it.key, kind: it.kind, title: it.title, subtitle: it.subtitle, image: it.image, parent: it.parent,
      position: finished ? dur : it.kind === 'live' ? 0 : Math.round(video.currentTime * 1000), duration: dur, watched: Math.round(watched),
      day: new Date().toLocaleDateString('sv') };
    watched = 0;
    fetch(API + 'progress', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify(body) }).catch(() => {});
  };
  setInterval(() => {
    const now = Date.now();
    if (!video.paused) watched += (now - lastTick) / 1000;
    lastTick = now;
    if (watched >= 30) flush();
  }, 1000);
  window.addEventListener('pagehide', () => flush());

  const fail = () => {
    $('.msg').textContent = 'Dit kan in de browser niet worden afgespeeld. Probeer de tv- of telefoon-app.';
    $('.msg').classList.remove('hidden');
  };
  const load = () => {
    const it = items[i];
    $('.txt b').textContent = it.title;
    $('.txt span').textContent = it.subtitle || '';
    $('.msg').classList.add('hidden');
    if (hls) { hls.destroy(); hls = null; }
    const isHls = /\.m3u8(\?|$)/i.test(it.url);
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isHls && !ios && window.Hls?.isSupported()) {
      hls = new Hls({ backBufferLength: 30 });
      hls.loadSource(it.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
    } else {
      video.src = it.url;
    }
    if (startAt && !live) video.addEventListener('loadedmetadata', () => { video.currentTime = startAt / 1000; startAt = 0; }, { once: true });
    video.play().catch(() => {});
  };
  video.addEventListener('error', fail);
  video.addEventListener('ended', () => { flush(true); if (!live && i < items.length - 1) { i++; load(); } else back(); });
  const go = (d) => { flush(); i = (i + d + items.length) % items.length; load(); };
  if (live && items.length > 1) {
    $('#prev').classList.remove('hidden'); $('#next').classList.remove('hidden');
    $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') back();
    else if (live && (e.key === 'ArrowUp' || e.key === 'PageUp')) go(-1);
    else if (live && (e.key === 'ArrowDown' || e.key === 'PageDown')) go(1);
  });
  load();
}
</script>
</body>
</html>
